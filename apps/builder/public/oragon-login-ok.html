<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login concluído · Oragon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0d; color: #ededf0;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #9a9aa4; margin: 0; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Pronto, você entrou no editor.</h1>
  <p>Pode fechar esta janela — o editor já abre dentro do CRM.</p>
</main>
<script>
  // Aberta pelo CRM (menu Bot) numa janela à parte: avisa o CRM e se fecha.
  // O CRM também confere a sessão sozinho, então nada quebra se o aviso não chegar.
  try { if (window.opener) window.opener.postMessage({ tipo: 'typebot-login-ok' }, 'https://www.oragon.app.br') } catch (e) {}
  setTimeout(function () { try { window.close() } catch (e) {} }, 700)
</script>
</body>
</html>
